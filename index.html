<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMVCo QR Code Inspector</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
colors: {
brand: {
50: '#f0f7ff',
100: '#e0effe',
500: '#3b82f6',
600: '#2563eb',
700: '#1d4ed8',
}
}
}
}
}
</script>
<!-- jsQR Library for decoding QR codes -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Inter & Mono Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
.glass-card {
background: rgba(255, 255, 255, 0.8);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
}
.dark .glass-card {
background: rgba(15, 23, 42, 0.8);
}
</style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 flex flex-col">

<!-- Header -->
<header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-40">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
<i class="fa-solid fa-qrcode text-xl"></i>
</div>
<div>
<h1 class="font-bold text-lg leading-tight">EMVCo QR Inspector</h1>
<p class="text-xs text-slate-500 dark:text-slate-400">Dynamic TLV Parser & Validator</p>
</div>
</div>
<button id="themeToggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
<i class="fa-solid fa-moon dark:hidden"></i>
<i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
</button>
</div>
</header>

<!-- Main Container -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
<section class="grid grid-cols-1 lg:grid-cols-12 gap-6">

<!-- Upload & Input Column -->
<div class="lg:col-span-5 flex flex-col gap-4">
<div id="dropZone" class="glass-card relative border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-6 text-center cursor-pointer hover:border-blue-500 dark:hover:border-blue-400 transition flex flex-col items-center justify-center min-h-[180px] shadow-sm">
<input type="file" id="fileInput" accept="image/*" class="hidden">
<div class="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-3">
<i class="fa-solid fa-cloud-arrow-up text-xl"></i>
</div>
<p class="font-semibold text-slate-700 dark:text-slate-200">Upload QR Image</p>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Drag & drop or click to browse</p>
</div>

<div class="glass-card border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
<label for="rawInput" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Raw Payload String</label>
<textarea id="rawInput" rows="4" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Paste EMVCo String here..."></textarea>
<div class="flex gap-2 mt-3">
<button id="parseBtn" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl transition shadow-md shadow-blue-500/10">Parse Payload</button>
<button id="clearBtn" class="px-4 py-2.5 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium text-sm rounded-xl transition">Clear</button>
</div>
</div>
</div>

<!-- Canvas Preview Column -->
<div class="lg:col-span-7">
<div class="glass-card border border-slate-200 dark:border-slate-800 rounded-2xl p-4 h-full flex flex-col justify-between shadow-sm relative min-h-[280px]">
<div class="flex items-center justify-between mb-3">
<h2 class="font-semibold text-sm">QR Code Preview</h2>
</div>
<div class="flex-1 flex items-center justify-center bg-slate-100 dark:bg-slate-900/50 rounded-xl p-4 border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
<canvas id="qrCanvas" class="max-h-[220px] object-contain rounded-lg hidden"></canvas>
<p id="canvasPlaceholder" class="text-xs text-slate-400 flex items-center gap-2">
<i class="fa-regular fa-image text-base"></i> Upload an image to preview the QR code
</p>
</div>
</div>
</div>
</section>

<!-- TLV Results Breakdown -->
<section id="resultsSection" class="hidden glass-card border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
<h2 class="font-semibold text-base mb-4 flex items-center gap-2">
<i class="fa-solid fa-list-check text-blue-500"></i> Decoded TLV Structure
</h2>
<div class="overflow-x-auto">
<table class="w-full text-left text-xs">
<thead>
<tr class="border-b border-slate-200 dark:border-slate-800 text-slate-400 uppercase tracking-wider">
<th class="pb-3 font-semibold">Tag</th>
<th class="pb-3 font-semibold">Name</th>
<th class="pb-3 font-semibold">Len</th>
<th class="pb-3 font-semibold">Value</th>
</tr>
</thead>
<tbody id="tlvBody" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-mono">
<!-- Dynamic Rows -->
</tbody>
</table>
</div>
</section>
</main>

<script>
// Tag dictionary for standard EMVCo specifications
const TAG_NAMES = {
'00': 'Payload Format Indicator',
'01': 'Point of Initiation Method',
'26': 'Merchant Account Information',
'52': 'Merchant Category Code',
'53': 'Transaction Currency',
'54': 'Transaction Amount',
'58': 'Country Code',
'59': 'Merchant Name',
'60': 'Merchant City',
'62': 'Additional Data Field Template',
'63': 'CRC'
};

const SUBTAG_NAMES_26 = {
'00': 'Globally Unique Identifier',
'01': 'Payment Network Specific',
'02': 'Payment Network Specific',
'03': 'Payment Network Specific'
};

const SUBTAG_NAMES_62 = {
'01': 'Bill Number',
'02': 'Mobile Number',
'05': 'Reference Label',
'08': 'Purpose of Transaction'
};

// DOM Elements
const themeToggle = document.getElementById('themeToggle');
const rawInput = document.getElementById('rawInput');
const parseBtn = document.getElementById('parseBtn');
const clearBtn = document.getElementById('clearBtn');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const qrCanvas = document.getElementById('qrCanvas');
const canvasPlaceholder = document.getElementById('canvasPlaceholder');
const resultsSection = document.getElementById('resultsSection');
const tlvBody = document.getElementById('tlvBody');

// Dark Mode Toggle
themeToggle.addEventListener('click', () => {
document.documentElement.classList.toggle('dark');
});

// Drag & Drop Handling
dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
e.preventDefault();
dropZone.classList.add('border-blue-500');
});

dropZone.addEventListener('dragleave', () => {
dropZone.classList.remove('border-blue-500');
});

dropZone.addEventListener('drop', (e) => {
e.preventDefault();
dropZone.classList.remove('border-blue-500');
if (e.dataTransfer.files.length) {
handleFile(e.dataTransfer.files[0]);
}
});

fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

parseBtn.addEventListener('click', () => {
const str = rawInput.value.trim();
if (str) {
parseEMVCo(str);
} else {
alert('Please enter a valid EMVCo string or upload an image.');
}
});

clearBtn.addEventListener('click', () => {
rawInput.value = '';
tlvBody.innerHTML = '';
resultsSection.classList.add('hidden');
qrCanvas.classList.add('hidden');
canvasPlaceholder.classList.remove('hidden');
fileInput.value = '';
});

function handleFile(file) {
if (!file) return;
const img = new Image();
img.onload = () => {
const ctx = qrCanvas.getContext('2d');
qrCanvas.width = img.width;
qrCanvas.height = img.height;
ctx.drawImage(img, 0, 0);

qrCanvas.classList.remove('hidden');
canvasPlaceholder.classList.add('hidden');

const imageData = ctx.getImageData(0, 0, img.width, img.height);
const code = jsQR(imageData.data, imageData.width, imageData.height);

if (code) {
rawInput.value = code.data;
parseEMVCo(code.data);
} else {
alert('No valid QR code detected in the uploaded image.');
}
};
img.src = URL.createObjectURL(file);
}

// Generic Dynamic Parser
function parseEMVCo(str) {
tlvBody.innerHTML = '';
let index = 0;

try {
while (index < str.length) {
if (index + 4 > str.length) break;

const tag = str.substring(index, index + 2);
const len = parseInt(str.substring(index + 2, index + 4), 10);

if (isNaN(len) || index + 4 + len > str.length) {
break;
}

const val = str.substring(index + 4, index + 4 + len);
index += 4 + len;

const name = TAG_NAMES[tag] || 'Custom / Reserved Tag';
appendRow(tag, name, len, val, false);

// Parse template sub-tags dynamically
if (tag === '26') parseNested(val, SUBTAG_NAMES_26);
if (tag === '62') parseNested(val, SUBTAG_NAMES_62);
}
resultsSection.classList.remove('hidden');
} catch (e) {
alert('Error parsing the provided payload format.');
}
}

function parseNested(subStr, dictionary) {
let idx = 0;
while (idx < subStr.length) {
if (idx + 4 > subStr.length) break;
const tag = subStr.substring(idx, idx + 2);
const len = parseInt(subStr.substring(idx + 2, idx + 4), 10);

if (isNaN(len) || idx + 4 + len > subStr.length) break;

const val = subStr.substring(idx + 4, idx + 4 + len);
idx += 4 + len;

const name = dictionary[tag] || 'Sub-tag Specifier';
appendRow(tag, name, len, val, true);
}
}

function appendRow(tag, name, len, val, isNested) {
const tr = document.createElement('tr');
tr.className = isNested ? "bg-slate-50/50 dark:bg-slate-900/30 text-slate-500" : "hover:bg-slate-50 dark:hover:bg-slate-900/50";

tr.innerHTML = `
<td class="py-2.5 font-bold ${isNested ? 'pl-6 text-blue-500' : 'text-slate-700 dark:text-slate-200'}">[${tag}]</td>
<td class="py-2.5 font-sans">${name}</td>
<td class="py-2.5 text-slate-400">${len}</td>
<td class="py-2.5 break-all text-slate-800 dark:text-slate-200">${val}</td>
`;
tlvBody.appendChild(tr);
}
</script>
</body>
</html>
